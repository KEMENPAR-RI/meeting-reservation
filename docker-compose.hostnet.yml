# Opt-in for host MySQL bound to 127.0.0.1 only:
#   docker compose -f docker-compose.yml -f docker-compose.hostnet.yml up -d
services:
  app:
    network_mode: host
    environment:
      DB_HOST: 127.0.0.1
      # Listen on loopback only; nginx stays the sole entry point.
      HOSTNAME: 127.0.0.1
      PORT: 8282
    ports: !reset []
    extra_hosts: !reset []
